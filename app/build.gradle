plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aosp.carrier'
    compileSdk 33

    defaultConfig {
        applicationId "com.aosp.carrier"
        minSdk 31   // 只声明支持 Android 12 及以后
        targetSdk 33
        versionCode 4
        versionName "2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // 用 debug 签名，便于自用直装；如需正式发布请换成自己的 keystore
            signingConfig signingConfigs.debug
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    packagingOptions {
        resources.excludes += ['META-INF/*']
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
